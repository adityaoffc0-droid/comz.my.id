<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comz</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    #contentFrame {
      width: 100%;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <iframe id="contentFrame" src="about:blank"></iframe>

  <script>
    fetch('links.json')
      .then(response => response.json())
      .then(data => {
        const frame = document.getElementById('contentFrame');
        frame.src = data.url;
      })
      .catch(err => {
        document.body.innerHTML = '<h1 style="color:white; text-align:center;">Error loading web content</h1>';
      });
  </script>
</body>
</html>

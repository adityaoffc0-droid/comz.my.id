<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comz</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0f172a; }
    
    /* Frame Styling */
    #contentFrame {
      width: 100%;
      height: 100vh;
      border: none;
    }

    /* Menu & UI (Overlay) */
    .menu-bar { position: fixed; top: 10px; right: 10px; z-index: 100; }
    .btn-owner { 
      background: #3b82f6; color: white; padding: 10px 20px; 
      text-decoration: none; border-radius: 8px; font-weight: bold;
    }
  </style>
</head>
<body>
  
  <div class="menu-bar">
    <a href="https://t.me/planetind" target="_blank" class="btn-owner">Owner</a>
  </div>

  <iframe id="contentFrame" src="about:blank"></iframe>

  <script>
    fetch('links.json')
      .then(response => response.json())
      .then(data => {
        const frame = document.getElementById('contentFrame');
        frame.src = data.url; 
      })
      .catch(err => {
        document.body.innerHTML = '<h1 style="color:white; text-align:center;">Error loading web content</h1>';
      });
  </script>
</body>
</html>
